name: CI 
 
on: 
  push: 
    branches: 
      - main 
 
jobs: 
  build: 
    name: Build Node.js application 
    runs-on: self-hosted
    environment: test
    steps: 
      - name: Checkout source code 
        uses: actions/checkout@v4 
 
      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: '22' 
          cache: npm 
 
      - name: Check versions 
        run: | 
          node --version 
          npm --version 
          docker --version 
 
      - name: Install dependencies 
        run: npm ci 
 
      - name: Run tests 
        run: npm test 
 
      - name: Login to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 
 
      - name: Build and push Docker image 
        uses: docker/build-push-action@v6 
        with: 
          context: . 
          push: true 
          tags: | 
            manister7/learning-node:latest 
            manister7/learning-node:${{ github.sha }} 
            manister7/learning-node:${{ github.run_number }} 